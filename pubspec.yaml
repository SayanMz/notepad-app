name: notepad
description: "A feature-rich offline notepad app built with Flutter, featuring rich text editing, Google Drive sync, SQL & Hive storage, HTML-PDF sharing and much more."
publish_to: 'none'

version: 2.0.0+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_quill: ^11.5.1
  lottie: ^3.5.1 
  flutter_colorpicker: ^1.1.0
  google_fonts: ^8.2.0

  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.4.2
  sqlite3: ^3.0.0
  flutter_secure_storage: ^10.3.1

  googleapis: ^16.0.0
  google_sign_in: ^7.2.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0

  file_picker: ^11.0.2
  path_provider: ^2.1.6
  pdf: ^3.13.0
  printing: ^5.15.0
  share_plus: ^12.0.2
  url_launcher: ^6.3.2
  http: ^1.6.0
  path: ^1.9.1
  ulid: ^2.0.0

  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5

  flutter_dotenv: ^6.0.1
  android_intent_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
   - .env
   - assets/lotties/
   - assets/images/
  
flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/images/notepad.png"
  min_sdk_android: 21 
  adaptive_icon_background: "#FFFFFF" 
  adaptive_icon_foreground: "assets/images/notepad.png"