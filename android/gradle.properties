# Performance Optimizations
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.configureondemand=true

# Memory Management (Adjusted for 8GB RAM systems)
# Using 4096M might be too high for an 8GB system; 2048M is safer to avoid OS-level swapping
org.gradle.jvmargs=-Xmx2048M -XX:MaxMetaspaceSize=512M -XX:+HeapDumpOnOutOfMemoryError -Dkotlin.daemon.jvm.options=-Xmx1024M

# Compatibility
android.useAndroidX=true