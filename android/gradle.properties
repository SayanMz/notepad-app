# Performance Optimizations
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.configureondemand=true
android.enableR8.fullMode=false
org.gradle.workers.max=4

# Memory Management (8GB RAM optimised)
# Capped Gradle daemon heap at 1536M and metaspace at 384M
org.gradle.jvmargs=-Xmx1536M -XX:MaxMetaspaceSize=384M -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED

# Kotlin Compiler Daemon Heap
kotlin.daemon.jvmargs=-Xmx1024M

# Compatibility
android.useAndroidX=true
android.builtInKotlin=false
android.newDsl=false
org.gradle.java.home=/usr/lib/jvm/java-21-openjdk-amd64